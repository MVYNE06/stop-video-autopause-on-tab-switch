name: Build & Publish Extension Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          zip -r always-active-media-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            inject.js \
            LICENSE \
            README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: always-active-media-${{ github.ref_name }}.zip
          generate_release_notes: true
